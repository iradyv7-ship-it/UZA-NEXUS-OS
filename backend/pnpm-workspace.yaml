packages:
  - api
  - worker
  - contracts

# Postinstall scripts are opt-in. These are the only packages allowed to run them.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  esbuild: true
  msgpackr-extract: true
  sharp: false

# @node-rs/xxhash 1.7.8's Windows binary needs VCRUNTIME140_1.dll (VC++ 2019+ runtime),
# which not every developer machine has. 1.7.6 does not. Remove once that is a given.
overrides:
  '@node-rs/xxhash': 1.7.6
